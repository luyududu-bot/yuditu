<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4e8db" />
    <title>屿地图｜央美花家地探索图鉴</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" id="hero">
        <div class="hero-map"></div>
        <div class="hero-shade"></div>
        <div class="hero-copy">
          <p class="eyebrow">CAFA HUAJIA DI · CAMPUS ATLAS</p>
          <h1>屿地图</h1>
          <p class="hero-line">AI时代，连接空间、展览与记忆，<br />让每一次校园探索都值得被珍藏</p>
          <button class="primary-button" id="enterButton">开始显影校园</button>
          <p class="microcopy">扫去尘沙，唤醒属于你的校园图鉴</p>
        </div>
      </section>

      <section class="map-screen is-hidden" id="mapScreen">
        <header class="topbar">
          <div>
            <p class="eyebrow">你的校园探索手册</p>
            <h2>屿地图</h2>
          </div>
          <button class="icon-button" id="resetButton" aria-label="重新探索">↻</button>
        </header>

        <section class="goal-card">
          <span class="spark">✦</span>
          <div class="goal-copy">
            <strong>今天想怎么逛？</strong>
            <span>说出目标，地图会读懂时间与兴趣</span>
          </div>
          <button id="goalToggle">告诉我</button>
          <form class="goal-form is-hidden" id="goalForm">
            <input id="goalInput" value="我第一次来，只有20分钟，想看最有代表性的地方" aria-label="探索目标" />
            <button type="submit">生成路线</button>
          </form>
          <div class="route-result is-hidden" id="routeResult"></div>
        </section>

        <section class="map-card">
          <div class="progress-row">
            <span>校园显影进度</span>
            <strong id="progressText">0%</strong>
          </div>
          <div class="progress-track"><i id="progressBar"></i></div>
          <div class="map-stage" id="mapStage">
            <img class="map-base" src="./assets/map.jpg" alt="中央美术学院花家地校区地图" />
            <div class="sand-overlay" id="sandOverlay"></div>
            <div class="route-lines" id="routeLines"></div>
            <div class="region-layer" id="regionLayer"></div>
            <div class="marker-layer" id="markerLayer"></div>
          </div>
          <p class="map-hint" id="mapHint">选择一片区域，用扫帚唤醒它</p>
        </section>

        <nav class="category-bar" aria-label="地点分类">
          <button class="active" data-category="全部">全部</button>
          <button data-category="建筑">建筑</button>
          <button data-category="展览">展览</button>
          <button data-category="补给">补给</button>
          <button data-category="打卡">打卡</button>
          <button data-category="出入口">出入口</button>
        </nav>
      </section>
    </main>

    <dialog class="unlock-dialog" id="unlockDialog">
      <button class="close-dialog" id="closeUnlock" aria-label="关闭">×</button>
      <p class="eyebrow">AREA DISCOVERY</p>
      <h2 id="unlockTitle">唤醒东部</h2>
      <p>拖动扫帚清扫尘沙，显影进度达到 60% 即可完成。</p>
      <div class="scratch-area" id="scratchArea">
        <img src="./assets/map.jpg" alt="" />
        <div class="scratch-sand" id="scratchSand"></div>
        <div class="brush-cursor" id="brushCursor">🧹</div>
      </div>
      <div class="scratch-progress"><i id="scratchBar"></i></div>
      <strong id="scratchText">显影 0%</strong>
    </dialog>

    <dialog class="detail-dialog" id="detailDialog">
      <button class="close-dialog" id="closeDetail" aria-label="关闭">×</button>
      <p class="detail-category" id="detailCategory"></p>
      <h2 id="detailName"></h2>
      <p id="detailDescription"></p>
      <div class="tag-list" id="detailTags"></div>
      <div class="object-note">
        <span>AI 可理解对象</span>
        <code id="detailObject"></code>
      </div>
    </dialog>

    <div class="toast is-hidden" id="toast"></div>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
